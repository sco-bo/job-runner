# Copy this file to profile.yaml and fill in your details.
# profile.yaml controls search parameters and scoring weights.
# Resume content lives in skills_bank.yaml.

name: "Your Name"

target_titles:
  - "Senior Product Manager"
  - "Director of Product"
  - "Group Product Manager"
  - "Head of Product"

target_levels:
  - senior
  - director
  - lead
  - head

years_experience: 8

target_salary_min: 150000
target_salary_max: 300000

preferred_remote: true

preferred_locations:
  - "Remote"
  - "United States"

preferred_company_size:   # startup, mid, large — leave empty to match all
  - startup
  - mid

avoid_keywords:           # jobs containing any of these get a 0.5x score penalty
  - "must be on-site"
  - "no remote"
  - "on-site required"

# Controls the tailor and interview prompts generated by the web UI.
# role_description is inserted as: "I'm [role_description] applying for the role below."
# tailor_guidance and interview_guidance are appended as extra instruction lines.
# These are gitignored — customize freely without affecting the public repo.
prompt_context:
  role_description: "a job applicant"   # e.g. "a Senior Product Manager", "a Staff Engineer"
  tailor_guidance: []
    # Add any custom lines you want injected into the tailor prompt, e.g.:
    # - "Ensure language reflects the work of a PM, not an engineer."
    # - "Before recommending bullets, identify the primary evaluation lens this role uses
    #    to assess PM candidates. Common lenses: execution rigor, technical depth,
    #    growth/revenue, compliance/regulatory, customer discovery."
    # - "On first mention of a point-of-sale system, write 'point-of-sale' in full."
  interview_guidance: []
    # Add any custom lines you want injected into the interview prep prompt, e.g.:
    # - "Include a mix of: behavioral (STAR-format), situational, technical/PM craft, and culture/values questions."
